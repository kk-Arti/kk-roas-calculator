<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;font-weight:400;src:url(../node_modules/@fontsource/montserrat/files/montserrat-latin-400-normal.woff2)}
@font-face{font-family:M;font-weight:600;src:url(../node_modules/@fontsource/montserrat/files/montserrat-latin-600-normal.woff2)}
@font-face{font-family:M;font-weight:700;src:url(../node_modules/@fontsource/montserrat/files/montserrat-latin-700-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(../node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2)}
html,body{margin:0;width:1200px;height:627px;overflow:hidden}
body{background:#1c1c1c;font-family:M;color:#fff;position:relative}
.arc{position:absolute;border-radius:50%;border:2px solid #179158;opacity:.35}
.a1{width:900px;height:900px;right:-420px;top:-300px}
.a2{width:640px;height:640px;right:-290px;top:-170px;opacity:.25}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,#072b1a 0,transparent 55%)}
.wrap{position:absolute;left:72px;top:64px;right:72px;bottom:56px;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:26px}
.brand img{width:56px;height:56px;border-radius:10px}
.eyebrow{margin-top:56px;color:#00d370;font-weight:600;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
h1{margin:14px 0 0;font-weight:800;font-size:66px;line-height:1.04;letter-spacing:-.02em;max-width:640px}
h1 span{color:#179158}
p{margin:22px 0 0;color:#cdcdcd;font-size:26px;max-width:600px;line-height:1.35}
.card{position:absolute;right:64px;bottom:72px;width:310px;background:#242424;border-radius:20px;padding:26px 28px;border:1px solid #2e2e2e}
.lbl{font-weight:600;font-size:15px;color:#a1a1a1;text-transform:uppercase;letter-spacing:.05em}
.big{font-weight:800;font-size:72px;letter-spacing:-.02em;line-height:1.05;margin-top:4px}
.pill{display:inline-block;margin-top:12px;background:#072b1a;color:#00d370;font-weight:700;font-size:17px;padding:6px 14px;border-radius:999px}
.bars{display:flex;align-items:flex-end;gap:10px;height:70px;margin-top:20px}
.bars i{flex:1;background:#179158;border-radius:4px 4px 0 0}
</style></head><body>
<div class="glow"></div><div class="arc a1"></div><div class="arc a2"></div>
<div class="wrap">
  <div class="brand"><img src="../public/apple-touch-icon.png" alt="">K&amp;K Media</div>
  <div class="eyebrow">Free calculator</div>
  <h1>Break-even <span>ROAS</span> for every product</h1>
  <p>Find the ROAS where the first order stops losing money. Free, no sign up.</p>
</div>
<div class="card">
  <div class="lbl">Break-even ROAS</div>
  <div class="big">1.76</div>
  <div class="pill">Above break-even</div>
  <div class="bars"><i style="height:50%"></i><i style="height:56%"></i><i style="height:62%"></i><i style="height:70%"></i><i style="height:78%"></i><i style="height:88%"></i><i style="height:100%"></i></div>
</div>
</body></html>
